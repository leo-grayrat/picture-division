<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>图片分割遮蔽翻开工具</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="main-wrapper">
      <section class="workspace column-main" aria-label="图片遮蔽工作区">
        <header class="page-header">
          <div>
            <h1>图片分割遮蔽翻开工具</h1>
            <p>一格一格翻开，猜猜看是哪部动画(～￣▽￣)～</p>
          </div>
          <button class="button-link" id="resetButton" type="button" disabled>全部遮蔽</button>
        </header>

        <section class="stage-section" aria-labelledby="stageTitle">
          <div class="section-heading">
            <h2 id="stageTitle">竞猜画面</h2>
            <span id="gridStatus">5 x 9</span>
          </div>
          <div class="stage" id="dropZone">
            <canvas id="imageCanvas" aria-label="可交互图片画布"></canvas>
            <div class="empty-state" id="emptyState">
              <strong>拖入图片，或从右侧选择文件</strong>
              <span>支持浏览器可读取的常见图片格式</span>
            </div>
          </div>
        </section>
      </section>

      <aside class="control-panel column-side" aria-label="操作面板">
        <section class="tool-section" aria-labelledby="imageSettingsTitle">
          <h2 id="imageSettingsTitle">图片</h2>
          <div id="manualImageControls">
            <label class="file-picker">
              <span class="button-primary">选择图片</span>
              <input class="file-picker-input" id="fileInput" type="file" accept="image/*">
            </label>
            <p class="section-note">也可直接将图片拖入左侧画面。</p>
          </div>
          <button class="button-link" id="showModeButton" type="button">展示模式</button>
          <div id="showModeControls" hidden>
            <p class="section-note" id="showQuestionStatus">第 1 题</p>
            <div class="action-list">
              <button class="button-link" id="prevQuestionButton" type="button" disabled>上一题</button>
              <button class="button-link" id="nextQuestionButton" type="button" disabled>下一题</button>
            </div>
            <p class="section-note">读取 show/ 下图片。</p>
          </div>
        </section>

        <section class="tool-section" aria-labelledby="gridSettingsTitle">
          <h2 id="gridSettingsTitle">网格设置</h2>
          <div class="grid-controls" aria-label="网格设置">
            <label>
              <span>行数</span>
              <input id="rowsInput" type="number" min="1" max="20" value="5">
            </label>
            <label>
              <span>列数</span>
              <input id="colsInput" type="number" min="1" max="20" value="9">
            </label>
          </div>
          <button class="button-primary" id="applyGridButton" type="button">应用网格</button>
        </section>

        <section class="tool-section" aria-labelledby="actionsTitle">
          <h2 id="actionsTitle">翻开与导出</h2>
          <div class="action-list">
            <button class="button-link" id="randomRevealButton" type="button" disabled>随机翻开一个</button>
            <button class="button-link" id="revealAllButton" type="button" disabled>全部翻开</button>
            <button class="button-primary" id="exportButton" type="button" disabled>导出当前图片</button>
          </div>
        </section>

        <section class="tool-section status-panel" aria-labelledby="statusTitle">
          <h2 id="statusTitle">当前状态</h2>
          <dl class="status-list">
            <div>
              <dt>已翻开</dt>
              <dd id="revealedStatus">0 / 20</dd>
            </div>
            <div>
              <dt>状态</dt>
              <dd id="messageStatus">等待导入图片</dd>
            </div>
          </dl>
        </section>
      </aside>
    </main>

    <footer class="page-footer">
      <span>界面样式参考 <a href="https://bangumi.tv/" target="_blank" rel="noreferrer">Bangumi</a> · </span>
      <a class="source-link" href="https://github.com/leo-grayrat/picture-division" target="_blank" rel="noreferrer">
        <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
          <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.08.55-.17.55-.38v-1.49c-2.23.49-2.7-1.08-2.7-1.08-.36-.93-.89-1.18-.89-1.18-.73-.5.06-.49.06-.49.81.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.88.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.13 0 0 .68-.22 2.2.82A7.7 7.7 0 0 1 8 4.8c.68 0 1.36.09 2 .27 1.52-1.04 2.2-.82 2.2-.82.44 1.11.16 1.93.08 2.13.52.56.83 1.27.83 2.15 0 3.08-1.87 3.75-3.65 3.95.29.25.54.73.54 1.47v2.18c0 .21.15.46.55.38A8 8 0 0 0 8 0Z" />
        </svg>
        源码
      </a>
    </footer>

    <script>
const canvas = document.querySelector("#imageCanvas");
const ctx = canvas.getContext("2d");
const fileInput = document.querySelector("#fileInput");
const rowsInput = document.querySelector("#rowsInput");
const colsInput = document.querySelector("#colsInput");
const applyGridButton = document.querySelector("#applyGridButton");
const randomRevealButton = document.querySelector("#randomRevealButton");
const revealAllButton = document.querySelector("#revealAllButton");
const resetButton = document.querySelector("#resetButton");
const exportButton = document.querySelector("#exportButton");
const emptyState = document.querySelector("#emptyState");
const dropZone = document.querySelector("#dropZone");
const gridStatus = document.querySelector("#gridStatus");
const revealedStatus = document.querySelector("#revealedStatus");
const messageStatus = document.querySelector("#messageStatus");
const manualImageControls = document.querySelector("#manualImageControls");
const showModeButton = document.querySelector("#showModeButton");
const showModeControls = document.querySelector("#showModeControls");
const showQuestionStatus = document.querySelector("#showQuestionStatus");
const prevQuestionButton = document.querySelector("#prevQuestionButton");
const nextQuestionButton = document.querySelector("#nextQuestionButton");

const SHOW_IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "webp"];

const state = {
  image: null,
  imageName: "anime-guess",
  rows: 5,
  cols: 9,
  revealed: [],
  step: 0,
  hoverIndex: -1,
  showMode: false,
  question: 0,
};

canvas.classList.add("is-empty");
updateStatus("等待导入图片");
syncGridStatus();

fileInput.addEventListener("change", (event) => {
  const [file] = event.target.files;
  if (file) loadImageFile(file);
});

dropZone.addEventListener("dragover", (event) => {
  event.preventDefault();
  if (state.showMode) return;
  dropZone.classList.add("is-dragging");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("is-dragging");
});

dropZone.addEventListener("drop", (event) => {
  event.preventDefault();
  dropZone.classList.remove("is-dragging");
  if (state.showMode) return;

  const [file] = event.dataTransfer.files;
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    updateStatus("请导入图片文件");
    return;
  }
  loadImageFile(file);
});

showModeButton.addEventListener("click", async () => {
  if (state.showMode) {
    state.showMode = false;
    state.question = 0;
    manualImageControls.hidden = false;
    showModeControls.hidden = true;
    showModeButton.textContent = "展示模式";
    updateStatus("已退出展示模式");
    return;
  }

  state.showMode = true;
  manualImageControls.hidden = true;
  showModeControls.hidden = false;
  showModeButton.textContent = "退出展示模式";
  await loadShowQuestion(1);
});

prevQuestionButton.addEventListener("click", async () => {
  if (state.question > 1) await loadShowQuestion(state.question - 1);
});

nextQuestionButton.addEventListener("click", async () => {
  await loadShowQuestion(state.question + 1);
});

applyGridButton.addEventListener("click", () => {
  applyGridFromInputs();
  if (state.image) {
    resetRevealed();
    draw();
    updateStatus("已应用新网格，并全部遮蔽");
  }
});

canvas.addEventListener("click", (event) => {
  if (!state.image) {
    updateStatus("请先导入图片");
    return;
  }

  const index = getCellIndexFromEvent(event);
  if (index === -1) return;

  state.revealed[index] = !state.revealed[index];
  state.step += 1;
  draw();
  updateStatus(state.revealed[index] ? `已翻开第 ${index + 1} 格` : `已遮蔽第 ${index + 1} 格`);
});

canvas.addEventListener("mousemove", (event) => {
  if (!state.image) return;
  const index = getCellIndexFromEvent(event);
  if (index !== state.hoverIndex) {
    state.hoverIndex = index;
    draw();
  }
});

canvas.addEventListener("mouseleave", () => {
  if (state.hoverIndex !== -1) {
    state.hoverIndex = -1;
    draw();
  }
});

randomRevealButton.addEventListener("click", () => {
  if (!state.image) {
    updateStatus("请先导入图片");
    return;
  }

  const hiddenCells = state.revealed
    .map((isRevealed, index) => (isRevealed ? -1 : index))
    .filter((index) => index !== -1);

  if (hiddenCells.length === 0) {
    updateStatus("已经全部翻开");
    return;
  }

  const index = hiddenCells[Math.floor(Math.random() * hiddenCells.length)];
  state.revealed[index] = true;
  state.step += 1;
  draw();
  updateStatus(`随机翻开第 ${index + 1} 格`);
});

revealAllButton.addEventListener("click", () => {
  if (!state.image) {
    updateStatus("请先导入图片");
    return;
  }

  state.revealed.fill(true);
  state.step += 1;
  draw();
  updateStatus("已全部翻开");
});

resetButton.addEventListener("click", () => {
  if (!state.image) {
    updateStatus("请先导入图片");
    return;
  }

  resetRevealed();
  draw();
  updateStatus("已全部遮蔽");
});

exportButton.addEventListener("click", () => {
  if (!state.image) {
    updateStatus("请先导入图片");
    return;
  }

  draw({ includeHover: false });
  const link = document.createElement("a");
  const safeName = state.imageName.replace(/[^\w-]+/g, "-").replace(/-+$/g, "") || "anime-guess";
  const step = String(state.step).padStart(3, "0");
  link.download = `${safeName}-${state.rows}x${state.cols}-step-${step}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  draw();
  updateStatus("已导出当前图片");
});

async function loadShowQuestion(questionNumber) {
  coverCanvas();
  showModeButton.disabled = true;
  prevQuestionButton.disabled = true;
  nextQuestionButton.disabled = true;
  showQuestionStatus.textContent = `第 ${questionNumber} 题`;
  updateStatus(`正在读取第 ${questionNumber} 题`);

  const result = await loadFirstShowImage(questionNumber);

  if (!result) {
    if (state.image) draw();
    showModeButton.disabled = false;
    prevQuestionButton.disabled = state.question <= 1;
    nextQuestionButton.disabled = true;
    showQuestionStatus.textContent = state.question ? `第 ${state.question} 题` : `第 ${questionNumber} 题`;
    updateStatus(`未找到第 ${questionNumber} 题`);
    return;
  }

  state.image = result.image;
  state.imageName = `show-${questionNumber}`;
  state.question = questionNumber;
  canvas.width = result.image.naturalWidth;
  canvas.height = result.image.naturalHeight;
  canvas.classList.remove("is-empty");
  emptyState.classList.add("is-hidden");
  applyGridFromInputs();
  resetRevealed();
  setControlsEnabled(true);
  draw();

  showModeButton.disabled = false;
  prevQuestionButton.disabled = questionNumber <= 1;
  nextQuestionButton.disabled = false;
  showQuestionStatus.textContent = `第 ${questionNumber} 题`;
  updateStatus(`第 ${questionNumber} 题已载入，当前为全遮蔽`);
}

async function loadFirstShowImage(index) {
  for (const extension of SHOW_IMAGE_EXTENSIONS) {
    const src = `show/${index}.${extension}`;
    try {
      const image = await loadImageFromPath(src);
      return { src, image };
    } catch {
      // Try the next supported extension.
    }
  }
  return null;
}

function loadImageFromPath(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.addEventListener("load", () => resolve(image));
    image.addEventListener("error", reject);
    image.src = src;
  });
}

function coverCanvas() {
  if (!state.image) return;
  ctx.save();
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

function loadImageFile(file) {
  const reader = new FileReader();

  reader.addEventListener("load", () => {
    const image = new Image();
    image.addEventListener("load", () => {
      state.image = image;
      state.imageName = file.name.replace(/\.[^.]+$/, "");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      canvas.classList.remove("is-empty");
      emptyState.classList.add("is-hidden");
      applyGridFromInputs();
      resetRevealed();
      setControlsEnabled(true);
      draw();
      updateStatus("图片已导入，当前为全遮蔽");
    });
    image.addEventListener("error", () => updateStatus("图片读取失败"));
    image.src = reader.result;
  });

  reader.addEventListener("error", () => updateStatus("文件读取失败"));
  reader.readAsDataURL(file);
}

function applyGridFromInputs() {
  state.rows = clampInteger(rowsInput.value, 1, 20, 4);
  state.cols = clampInteger(colsInput.value, 1, 20, 5);
  rowsInput.value = state.rows;
  colsInput.value = state.cols;
  syncGridStatus();
}

function resetRevealed() {
  state.revealed = Array.from({ length: state.rows * state.cols }, () => false);
  state.step += 1;
  syncGridStatus();
}

function draw(options = {}) {
  const includeHover = options.includeHover !== false;
  if (!state.image) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(state.image, 0, 0, canvas.width, canvas.height);

  const cellWidth = canvas.width / state.cols;
  const cellHeight = canvas.height / state.rows;

  ctx.save();
  ctx.fillStyle = "#000000";
  for (let row = 0; row < state.rows; row += 1) {
    for (let col = 0; col < state.cols; col += 1) {
      const index = row * state.cols + col;
      if (!state.revealed[index]) {
        ctx.fillRect(col * cellWidth, row * cellHeight, cellWidth, cellHeight);
      }
    }
  }
  ctx.restore();

  drawGrid(cellWidth, cellHeight);

  if (includeHover && state.hoverIndex !== -1) {
    drawHover(cellWidth, cellHeight);
  }

  syncGridStatus();
}

function drawGrid(cellWidth, cellHeight) {
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.78)";
  ctx.lineWidth = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 400));

  for (let col = 1; col < state.cols; col += 1) {
    const x = Math.round(col * cellWidth) + 0.5;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  for (let row = 1; row < state.rows; row += 1) {
    const y = Math.round(row * cellHeight) + 0.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawHover(cellWidth, cellHeight) {
  const row = Math.floor(state.hoverIndex / state.cols);
  const col = state.hoverIndex % state.cols;

  ctx.save();
  ctx.strokeStyle = "#18a883";
  ctx.lineWidth = Math.max(4, Math.round(Math.min(canvas.width, canvas.height) / 220));
  ctx.strokeRect(col * cellWidth + 2, row * cellHeight + 2, cellWidth - 4, cellHeight - 4);
  ctx.restore();
}

function getCellIndexFromEvent(event) {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * (canvas.width / rect.width);
  const y = (event.clientY - rect.top) * (canvas.height / rect.height);

  if (x < 0 || y < 0 || x > canvas.width || y > canvas.height) return -1;

  const col = Math.min(state.cols - 1, Math.floor(x / (canvas.width / state.cols)));
  const row = Math.min(state.rows - 1, Math.floor(y / (canvas.height / state.rows)));
  return row * state.cols + col;
}

function clampInteger(value, min, max, fallback) {
  const number = Number.parseInt(value, 10);
  if (Number.isNaN(number)) return fallback;
  return Math.min(max, Math.max(min, number));
}

function setControlsEnabled(enabled) {
  randomRevealButton.disabled = !enabled;
  revealAllButton.disabled = !enabled;
  resetButton.disabled = !enabled;
  exportButton.disabled = !enabled;
}

function syncGridStatus() {
  const total = state.rows * state.cols;
  const revealedCount = state.revealed.filter(Boolean).length;
  gridStatus.textContent = `${state.rows} x ${state.cols}`;
  revealedStatus.textContent = `${revealedCount} / ${total}`;
}

function updateStatus(message) {
  messageStatus.textContent = message;
}
    </script>
  </body>
</html>
